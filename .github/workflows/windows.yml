name: Bloop Windows
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: ilammy/msvc-dev-cmd@v1
      - run: npm ci
      - run: npm test
      - name: Build native Windows runtime and Bloop frontend
        run: node scripts/setup-windows.mjs
      - name: Check native Electron startup
        shell: pwsh
        run: |
          # A nonfunctional local fixture skips first-run sign-in; this smoke sends no model requests.
          '{"main":{"baseUrl":"https://api.deepseek.com/v1","model":"deepseek-flash","apiKey":"ci-window-smoke-placeholder"},"vision":{},"image":{}}' | Set-Content -Encoding utf8 data/settings.json
          $launcher = Start-Process node -ArgumentList 'scripts/start-desktop.mjs' -PassThru
          try {
            $ready = $false
            for ($attempt = 0; $attempt -lt 60; $attempt++) {
              Start-Sleep -Seconds 1
              if ($launcher.HasExited) { throw 'Bloop exited before opening its window.' }
              $window = Get-Process electron -ErrorAction SilentlyContinue | Where-Object { $_.MainWindowTitle -eq 'Bloop' }
              if ($window) { $ready = $true; break }
            }
            if (-not $ready) { throw 'Bloop did not open its native window within 60 seconds.' }
          } finally {
            if (Test-Path data/desktop.log) { Get-Content data/desktop.log -Tail 100 | ForEach-Object { $_ -replace 'token=[^ &]+','token=[redacted]' } }
            taskkill /PID $launcher.Id /T /F 2>$null
          }
      - name: Prepare portable runtime dependency closure
        run: node scripts/prepare-release-runtime.mjs
      - name: Package Windows portable release
        run: node scripts/package-release.mjs
      - name: Check relocated portable package without system Node or Git
        shell: pwsh
        run: |
          $zip = Get-ChildItem release/Bloop-v*-Windows-x64-portable.zip | Select-Object -First 1
          $smoke = Join-Path $env:RUNNER_TEMP 'Bloop relocated smoke'
          Expand-Archive $zip.FullName $smoke
          $exe = Join-Path $smoke 'Bloop/electron.exe'
          $stdout = Join-Path $env:RUNNER_TEMP 'bloop-portable-stdout.log'
          $stderr = Join-Path $env:RUNNER_TEMP 'bloop-portable-stderr.log'
          $launcher = Start-Process $exe -WorkingDirectory (Split-Path $exe) -RedirectStandardOutput $stdout -RedirectStandardError $stderr -PassThru
          try {
            $ready = $false
            for ($attempt = 0; $attempt -lt 90; $attempt++) {
              Start-Sleep -Seconds 1
              if ($launcher.HasExited) { throw 'Portable Bloop exited before opening its window.' }
              $window = Get-Process -Id $launcher.Id -ErrorAction SilentlyContinue
              if ($window.MainWindowTitle -eq 'Bloop') { $ready = $true; break }
            }
            if (-not $ready) { throw 'Portable Bloop did not open its native window.' }
          } finally {
            if (Test-Path $stderr) { Get-Content $stderr -Tail 80 | ForEach-Object { $_ -replace 'token=[^ &]+','token=[redacted]' } }
            taskkill /PID $launcher.Id /T /F 2>$null
          }
      - uses: actions/upload-artifact@v4
        with:
          name: Bloop-Windows-x64-portable
          path: |
            release/Bloop-v*-Windows-x64-portable.zip
            release/Bloop-v*-Windows-x64-portable.zip.sha256
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: Windows-diagnostics
          path: |
            data/desktop.log
            data/harness-source/apps/desktop/.desktop-build/packaging-runs/
          if-no-files-found: ignore
